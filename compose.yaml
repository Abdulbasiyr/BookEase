services:
  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db

  # Database
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookease
      POSTGRES_PASSWORD: bookease_password
      POSTGRES_DB: bookease
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: